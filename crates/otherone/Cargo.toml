[package]
name = "otherone"
version = "0.4.0"
edition = "2021"
license = "MIT"
readme = "../../README.md"
documentation = "https://docs.rs/otherone"
repository = "https://github.com/wuyoujae/otherone-agent"
keywords = ["ai", "agent", "llm", "mcp", "skills"]
categories = ["api-bindings", "asynchronous"]
description = "otherone — 轻量级、可扩展的 Rust AI Agent 框架"

[dependencies]
otherone-ai = { version = "0.4.0", path = "../otherone-ai" }
otherone-agent = { version = "0.4.0", path = "../otherone-agent" }
otherone-context = { version = "0.4.0", path = "../otherone-context" }
otherone-memory = { version = "0.4.0", path = "../otherone-memory" }
otherone-tools = { version = "0.4.0", path = "../otherone-tools" }
otherone-storage = { version = "0.4.0", path = "../otherone-storage" }
otherone-skills = { version = "0.4.0", path = "../otherone-skills" }
otherone-mcp = { version = "0.4.0", path = "../otherone-mcp" }
serde_json = { workspace = true }
tokio = { workspace = true }
